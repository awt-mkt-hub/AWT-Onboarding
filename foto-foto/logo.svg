<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67300;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Geometric abstract symbol (stylized F monogram with hexagonal frame) -->
  <g transform="translate(10, 8)">
    <!-- Hexagon background -->
    <polygon points="37,4 63,4 74,22.5 63,41 37,41 26,22.5" fill="url(#iconGrad)" />
    <!-- Inner white F-shaped symbol -->
    <rect x="35" y="13" width="18" height="3.5" rx="1.5" fill="#ffffff" />
    <rect x="35" y="13" width="3.5" height="19" rx="1.5" fill="#ffffff" />
    <rect x="35" y="22" width="13" height="3.5" rx="1.5" fill="#ffffff" />
    <!-- Small accent dot -->
    <circle cx="58" cy="29" r="2.5" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Divider line -->
  <line x1="94" y1="18" x2="94" y2="72" stroke="#FF8C00" stroke-width="1.5" stroke-linecap="round" opacity="0.35" />

  <!-- Main text: "Foto" large -->
  <text
    x="108"
    y="46"
    font-family="Montserrat, Arial, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#1A1A2E"
    letter-spacing="1.5">Foto</text>

  <!-- Sub text: "Foto" smaller, styled, below -->
  <text
    x="109"
    y="68"
    font-family="Montserrat, Arial, sans-serif"
    font-size="13"
    font-weight="400"
    fill="#FF8C00"
    letter-spacing="5">FOTO</text>

  <!-- Accent underline below sub text -->
  <rect x="109" y="73" width="42" height="2" rx="1" fill="#FF8C00" opacity="0.4" />
</svg>
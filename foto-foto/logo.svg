<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67300;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Stylized geometric symbol - overlapping hexagonal/diamond forms -->
  <g transform="translate(10, 10)">
    <!-- Outer hexagon shape -->
    <polygon points="35,0 60,14 60,56 35,70 10,56 10,14" fill="url(#iconGrad)" opacity="0.15"/>
    <!-- Inner accent diamond -->
    <polygon points="35,10 55,25 55,45 35,60 15,45 15,25" fill="none" stroke="#FF8C00" stroke-width="2" opacity="0.4"/>
    <!-- Core bold diamond -->
    <polygon points="35,16 52,30 52,50 35,64 18,50 18,30" fill="url(#iconGrad)"/>
    <!-- Inner white cutout for depth -->
    <polygon points="35,26 46,34 46,46 35,54 24,46 24,34" fill="white" opacity="0.25"/>
    <!-- Center dot accent -->
    <circle cx="35" cy="40" r="5" fill="white" opacity="0.9"/>
  </g>

  <!-- Vertical divider -->
  <line x1="90" y1="18" x2="90" y2="72" stroke="#FF8C00" stroke-width="1.5" opacity="0.3"/>

  <!-- Main text: "Foto" large -->
  <text
    x="104"
    y="50"
    font-family="Montserrat, Arial, sans-serif"
    font-size="38"
    font-weight="700"
    fill="#1A1A2E"
    letter-spacing="-0.5"
  >Foto</text>

  <!-- Sub text: "Foto" smaller, styled, in brand color -->
  <text
    x="106"
    y="68"
    font-family="Montserrat, Arial, sans-serif"
    font-size="13"
    font-weight="400"
    fill="#FF8C00"
    letter-spacing="4"
  >FOTO</text>

</svg>
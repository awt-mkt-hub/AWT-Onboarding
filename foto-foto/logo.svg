<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67300;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Abstract geometric symbol (stylized F monogram with diamond/hexagon shape) -->
  <g transform="translate(10, 8)">
    <!-- Outer hexagon shape -->
    <polygon points="37,4 59,16 59,42 37,54 15,42 15,16" fill="url(#iconGrad)" />
    <!-- Inner white F letterform -->
    <rect x="26" y="20" width="22" height="4" fill="white" rx="1"/>
    <rect x="26" y="27" width="16" height="4" fill="white" rx="1"/>
    <rect x="26" y="20" width="4" height="18" fill="white" rx="1"/>
  </g>

  <!-- Divider line -->
  <line x1="82" y1="18" x2="82" y2="72" stroke="#FF8C00" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Main name: "Foto" large -->
  <text
    x="96"
    y="48"
    font-family="'Montserrat', 'Arial', sans-serif"
    font-size="38"
    font-weight="700"
    fill="#1A1A2E"
    letter-spacing="1"
  >Foto</text>

  <!-- Subtitle: "Foto" smaller, accent color -->
  <text
    x="97"
    y="67"
    font-family="'Montserrat', 'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#FF8C00"
    letter-spacing="5"
  >FOTO</text>

  <!-- Small accent dot after subtitle -->
  <circle cx="162" cy="63" r="2.5" fill="#FF8C00" opacity="0.7"/>
</svg>
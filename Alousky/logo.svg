<svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg" style="background:transparent">
  <!-- Icon: Stylized "A" geometric monogram left side -->
  <g transform="translate(12, 10)">
    <!-- Outer geometric shape: bold angular A monogram -->
    <polygon points="34,5 58,65 48,65 34,32 20,65 10,65" fill="#DB0000"/>
    <!-- Crossbar cutout -->
    <polygon points="22,48 46,48 44,55 24,55" fill="white"/>
    <!-- Inner triangle accent -->
    <polygon points="34,14 40,30 28,30" fill="white"/>
  </g>

  <!-- Wordmark: ALOUSKY -->
  <text
    x="82"
    y="52"
    font-family="Arial, Helvetica, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="2"
    fill="#1A1A1A"
  >ALOUSKY</text>

  <!-- Tagline: multi family office -->
  <text
    x="84"
    y="70"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="4"
    fill="#DB0000"
  >MULTI FAMILY OFFICE</text>

  <!-- Thin red accent line under icon -->
  <rect x="12" y="78" width="58" height="2.5" fill="#DB0000" rx="1"/>
</svg>
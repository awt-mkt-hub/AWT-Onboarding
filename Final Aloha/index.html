<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Aloha — Planejamento Patrimonial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary: #8F76A3;
  --primary-dark: #2a1a3e;
  --primary-mid: #5a3f72;
  --white: #ffffff;
  --light-bg: #f8f7fa;
  --dark-bg: #1e1028;
  --text-dark: #1a1a1a;
  --text-muted: #555555;
  --border: #e0d9e8;
  --gold: #c9b8d8;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #ffffff;
  color: #1a1a1a;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ===== HERO ===== */
#hero {
  min-height: 100vh;
  background: #1e1028;
  background-image: 
    radial-gradient(ellipse at 20% 50%, rgba(143,118,163,0.18) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(90,63,114,0.15) 0%, transparent 50%);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.hero-inner {
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex: 1;
  padding: 0 6vw;
  padding-top: 100px;
  padding-bottom: 160px;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  position: relative;
  z-index: 2;
}

.hero-label {
  display: inline-block;
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #c9b8d8;
  margin-bottom: 2.5rem;
}

.hero-label::before {
  content: "——— ";
  color: #8F76A3;
}

.hero-logo {
  margin-bottom: 2.5rem;
  width: 220px;
}

.hero-logo img,
.hero-logo svg {
  width: 220px;
  height: auto;
  display: block;
}

h1.hero-headline {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(2.6rem, 5.5vw, 4.8rem);
  font-weight: 900;
  line-height: 1.08;
  color: #ffffff;
  max-width: 820px;
  margin-bottom: 2rem;
}

h1.hero-headline em {
  font-style: italic;
  color: #c9b8d8;
}

h1.hero-headline .muted {
  color: rgba(255,255,255,0.38);
  font-weight: 400;
}

.hero-sub {
  font-family: 'Inter', sans-serif;
  font-size: 1.05rem;
  font-weight: 400;
  color: rgba(255,255,255,0.65);
  max-width: 520px;
  margin-bottom: 2.8rem;
  line-height: 1.7;
}

.hero-ctas {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

.btn-primary {
  display: inline-block;
  background: #8F76A3;
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  padding: 0.9rem 2.2rem;
  border-radius: 2.5rem;
  text-decoration: none;
  border: 2px solid #8F76A3;
  cursor: pointer;
}

.btn-primary:hover {
  background: #7a5f91;
  border-color: #7a5f91;
}

.btn-secondary {
  display: inline-block;
  background: transparent;
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  padding: 0.9rem 2.2rem;
  border-radius: 2.5rem;
  text-decoration: none;
  border: 2px solid rgba(255,255,255,0.3);
  cursor: pointer;
}

.btn-secondary:hover {
  border-color: rgba(255,255,255,0.7);
  color: #ffffff;
}

.hero-disclaimer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(10,5,20,0.75);
  border-top: 1px solid rgba(143,118,163,0.3);
  padding: 1.2rem 6vw;
  z-index: 3;
}

.hero-disclaimer p {
  font-family: 'Inter', sans-serif;
  font-size: 0.75rem;
  font-weight: 400;
  color: rgba(255,255,255,0.55);
  line-height: 1.6;
  max-width: 1100px;
  margin: 0 auto;
}

/* Geometric decoration */
.hero-geo {
  position: absolute;
  right: -80px;
  top: 50%;
  transform: translateY(-50%);
  width: 500px;
  height: 500px;
  opacity: 0.07;
  z-index: 1;
  pointer-events: none;
}

/* ===== NAV ===== */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(30,16,40,0.92);
  border-bottom: 1px solid rgba(143,118,163,0.2);
  padding: 1.1rem 6vw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(10px);
}

.nav-logo {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: #ffffff;
  text-decoration: none;
  letter-spacing: 0.04em;
}

.nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.nav-links a {
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  letter-spacing: 0.04em;
}

.nav-links a:hover {
  color: #c9b8d8;
}

.nav-cta {
  background: #8F76A3;
  color: #ffffff !important;
  padding: 0.5rem 1.3rem;
  border-radius: 2rem;
  font-weight: 600 !important;
}

.nav-cta:hover {
  background: #7a5f91;
  color: #ffffff !important;
}

/* ===== TRUST BAR ===== */
#trust-bar {
  background: #ffffff;
  border-bottom: 1px solid #e8e2f0;
  padding: 2rem 6vw;
}

.trust-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  gap: 3rem;
  flex-wrap: wrap;
}

.trust-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.trust-icon {
  width: 32px;
  height: 32px;
  background: #f0ebf7;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.trust-icon svg {
  width: 16px;
  height: 16px;
  stroke: #8F76A3;
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.trust-text {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  color: #2a1a3e;
  line-height: 1.4;
}

/* ===== SECTION BASE ===== */
section {
  padding: 6rem 6vw;
}

.section-label {
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #8F76A3;
  margin-bottom: 1.5rem;
  display: block;
}

.section-label::before {
  content: "——— ";
}

h2.section-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 1.2rem;
}

h2.section-title em {
  font-style: italic;
  color: #8F76A3;
}

.section-desc {
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  font-weight: 400;
  color: #555555;
  max-width: 560px;
  line-height: 1.75;
}

/* ===== ESPECIALIDADES ===== */
#especialidades {
  background: #ffffff;
}

.especialidades-inner {
  max-width: 1100px;
  margin: 0 auto;
}

.especialidades-header {
  margin-bottom: 3.5rem;
}

.especialidades-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
}

.card-esp {
  background: #faf8fc;
  border: 1px solid #e8e2f0;
  border-left: 3px solid #8F76A3;
  padding: 2rem 1.8rem;
  position: relative;
}

.card-esp:hover {
  border-left-color: #5a3f72;
  background: #f5f1fa;
}

.card-esp-number {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 2.5rem;
  font-weight: 900;
  color: #e8e2f0;
  line-height: 1;
  margin-bottom: 0.8rem;
  display: block;
}

.card-esp h3 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: #2a1a3e;
  margin-bottom: 0.8rem;
}

.card-esp p {
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  color: #555555;
  line-height: 1.65;
}

/* ===== SOBRE ===== */
#sobre {
  background: #f8f7fa;
}

.sobre-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5rem;
  align-items: center;
}

.sobre-content h2.section-title {
  color: #2a1a3e;
}

.sobre-content p {
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  color: #444444;
  line-height: 1.8;
  margin-bottom: 1.2rem;
}

.valores-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2rem;
}

.valor-item {
  background: #ffffff;
  border: 1px solid #e8e2f0;
  padding: 1.4rem 1.2rem;
}

.valor-item span.tag {
  font-family: 'Inter', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #8F76A3;
  display: block;
  margin-bottom: 0.4rem;
}

.valor-item p {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  color: #444444;
  line-height: 1.55;
  margin: 0;
}

/* ===== DIFERENCIAIS ===== */
#diferenciais {
  background: #2a1a3e;
}

.diferenciais-inner {
  max-width: 1100px;
  margin: 0 auto;
}

.diferenciais-inner .section-label {
  color: #c9b8d8;
}

.diferenciais-inner h2.section-title {
  color: #ffffff;
}

.diferenciais-inner h2.section-title em {
  color: #c9b8d8;
  font-style: italic;
}

.diferenciais-inner .section-desc {
  color: rgba(255,255,255,0.65);
}

.dif-list {
  margin-top: 3.5rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}

.dif-item {
  display: flex;
  gap: 1.2rem;
  align-items: flex-start;
}

.dif-line {
  width: 2px;
  min-height: 60px;
  background: #8F76A3;
  flex-shrink: 0;
  margin-top: 4px;
}

.dif-text h4 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 0.4rem;
}

.dif-text p {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.6);
  line-height: 1.65;
}

/* ===== CTA FINAL ===== */
#cta-final {
  background: #1e1028;
  text-align: center;
  padding: 7rem 6vw;
}

.cta-final-inner {
  max-width: 700px;
  margin: 0 auto;
}

.cta-final-inner .section-label {
  justify-content: center;
  color: #c9b8d8;
  display: block;
  text-align: center;
}

.cta-final-inner h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 700;
  color: #ffffff;
  line-height: 1.2;
  margin-bottom: 1.2rem;
}

.cta-final-inner h2 em {
  font-style: italic;
  color: #c9b8d8;
}

.cta-final-inner p {
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  color: rgba(255,255,255,0.6);
  line-height: 1.75;
  margin-bottom: 2.5rem;
}

.cta-final-btns {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
}

/* ===== CONTATO ===== */
#contato {
  background: #f8f7fa;
}

.contato-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: start;
}

.contato-info h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(1.8rem, 3.5vw, 2.5rem);
  font-weight: 700;
  color: #2a1a3e;
  margin-bottom: 1.2rem;
}

.contato-info p {
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  color: #555555;
  line-height: 1.75;
  margin-bottom: 2rem;
}

.contato-links {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.contato-link {
  display: flex;
  align-items: center;
  gap: 1rem;
  text-decoration: none;
}

.contato-link-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #f0ebf7;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.contato-link-icon svg {
  width: 18px;
  height: 18px;
  fill: #8F76A3;
}

.contato-link-text span {
  display: block;
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #8F76A3;
}

.contato-link-text strong {
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  font-weight: 500;
  color: #2a1a3e;
}

.contato-link:hover .contato-link-text strong {
  color: #8F76A3;
}

.contato-cta-box {
  background: #2a1a3e;
  padding: 2.5rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  justify-content: center;
}

.contato-cta-box h3 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.3;
}

.contato-cta-box p {
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.6);
  line-height: 1.65;
}

/* ===== FOOTER ===== */
footer {
  background: #12091d;
  padding: 4rem 6vw 2.5rem;
  border-top: 1px solid rgba(143,118,163,0.2);
}

.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
}

.footer-top {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr;
  gap: 3rem;
  padding-bottom: 3rem;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 2rem;
}

.footer-brand p {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.45);
  line-height: 1.7;
  margin-top: 1rem;
  max-width: 320px;
}

.footer-col h4 {
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #8F76A3;
  margin-bottom: 1.2rem;
}

.footer-col ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.footer-col ul li a {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
  text-decoration: none;
}

.footer-col ul li a:hover {
  color: #c9b8d8;
}

.footer-col ul li span {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
}

.footer-disclaimer {
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.4);
  line-height: 1.7;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.footer-bottom {
  margin-top: 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

.footer-bottom p {
  font-family: 'Inter', sans-serif;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.3);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .sobre-inner {
    grid-template-columns: 1fr;
    gap: 3rem;
  }
  .dif-list {
    grid-template-columns: 1fr;
  }
  .footer-top {
    grid-template-columns: 1fr 1fr;
  }
  .contato-inner {
    grid-template-columns: 1fr;
    gap: 2.5rem;
  }
  .nav-links {
    display: none;
  }
}

@media (max-width: 600px) {
  section {
    padding: 4rem 5vw;
  }
  .hero-inner {
    padding: 0 5vw;
    padding-top: 90px;
    padding-bottom: 150px;
  }
  .footer-top {
    grid-template-columns: 1fr;
    gap: 2rem;
  }
  .trust-inner {
    flex-direction: column;
    align-items: flex-start;
    gap: 1.5rem;
  }
  .valores-grid {
    grid-template-columns: 1fr;
  }
  .hero-logo {
    width: 160px;
  }
  .hero-logo img,
  .hero-logo svg {
    width: 160px;
  }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="#hero" class="nav-logo">Final Aloha</a>
  <ul class="nav-links">
    <li><a href="#especialidades">Especialidades</a></li>
    <li><a href="#sobre">Sobre</a></li>
    <li><a href="#contato">Contato</a></li>
    <li><a href="https://wa.me/5511989667904" class="nav-cta" target="_blank" rel="noopener">Conversar</a></li>
  </ul>
</nav>

<!-- HERO -->
<section id="hero">
  <!-- Geometric decoration -->
  <svg class="hero-geo" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="200" cy="200" r="180" stroke="#8F76A3" stroke-width="1"/>
    <circle cx="200" cy="200" r="140" stroke="#8F76A3" stroke-width="1"/>
    <circle cx="200" cy="200" r="100" stroke="#8F76A3" stroke-width="1"/>
    <line x1="20" y1="200" x2="380" y2="200" stroke="#8F76A3" stroke-width="1"/>
    <line x1="200" y1="20" x2="200" y2="380" stroke="#8F76A3" stroke-width="1"/>
  </svg>

  <div class="hero-inner">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C45DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A02AFA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Abstract W monogram with geometric diamond/rhombus shape -->
  <g transform="translate(12, 10)">
    <!-- Outer hexagon shape -->
    <polygon points="34,2 58,16 58,44 34,58 10,44 10,16" fill="url(#iconGrad)" />
    <!-- Inner W shape cut-out in white -->
    <polyline points="18,22 24,42 34,30 44,42 50,22" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Small accent line under W -->
    <line x1="22" y1="46" x2="46" y2="46" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- "Wealth" text -->
  <text
    x="82"
    y="43"
    font-family="Arial, Helvetica, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="1"
    fill="#A02AFA">Wealth</text>

  <!-- Thin separator line -->
  <line x1="82" y1="50" x2="280" y2="50" stroke="#A02AFA" stroke-width="0.8" opacity="0.3"/>

  <!-- "GUsta" text -->
  <text
    x="84"
    y="68"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="400"
    letter-spacing="5.5"
    fill="#A02AFA"
    opacity="0.85">GUsta</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9000FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B00CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Geometric diamond/rhombus with inner structure representing wealth management -->
  <g transform="translate(12, 10)">
    <!-- Outer hexagon/diamond shape -->
    <polygon points="34,2 58,16 58,44 34,58 10,44 10,16" fill="none" stroke="url(#primaryGrad)" stroke-width="2.2"/>
    <!-- Inner accent lines suggesting upward growth / capital -->
    <line x1="34" y1="14" x2="34" y2="46" stroke="#9000FF" stroke-width="1.2" opacity="0.35"/>
    <line x1="18" y1="24" x2="50" y2="24" stroke="#9000FF" stroke-width="1.2" opacity="0.35"/>
    <!-- Central monogram T stylized -->
    <line x1="34" y1="17" x2="34" y2="43" stroke="url(#primaryGrad)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="24" y1="22" x2="44" y2="22" stroke="url(#primaryGrad)" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Small accent dot bottom -->
    <circle cx="34" cy="47" r="1.8" fill="#9000FF"/>
  </g>

  <!-- Name: TEs -->
  <text
    x="82"
    y="43"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36"
    font-weight="700"
    letter-spacing="1.5"
    fill="#9000FF">TEs</text>

  <!-- Subtitle: Wealth -->
  <text
    x="84"
    y="62"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13"
    font-weight="400"
    letter-spacing="5.5"
    fill="#9000FF"
    opacity="0.75">WEALTH</text>

  <!-- Thin separator line under subtitle -->
  <line x1="84" y1="68" x2="210" y2="68" stroke="#9000FF" stroke-width="0.6" opacity="0.3"/>
</svg>
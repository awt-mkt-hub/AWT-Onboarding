<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9000FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6000CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9000FF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#9000FF;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Ícone geométrico: hexágono estilizado com monograma T -->
  <g transform="translate(12, 10)">
    <!-- Hexágono externo preenchido suave -->
    <polygon points="34,2 58,16 58,44 34,58 10,44 10,16" fill="url(#grad2)" stroke="url(#grad1)" stroke-width="1.8"/>

    <!-- Linha decorativa interna superior -->
    <line x1="20" y1="22" x2="48" y2="22" stroke="#9000FF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Haste vertical do T -->
    <line x1="34" y1="22" x2="34" y2="42" stroke="#9000FF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Detalhe: pequeno losango central decorativo -->
    <rect x="30.5" y="34" width="7" height="7" rx="1" fill="none" stroke="#9000FF" stroke-width="1.2" transform="rotate(45 34 37.5)" opacity="0.5"/>
  </g>

  <!-- Nome principal "TEs" -->
  <text
    x="88"
    y="52"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-weight="700"
    fill="#9000FF"
    letter-spacing="1.5"
  >TEs</text>

  <!-- Linha separadora elegante -->
  <line x1="88" y1="60" x2="230" y2="60" stroke="#9000FF" stroke-width="0.6" opacity="0.35"/>

  <!-- Subtítulo -->
  <text
    x="89"
    y="75"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11"
    font-weight="400"
    fill="#9000FF"
    letter-spacing="3.5"
    opacity="0.75"
  >MULTI FAMILY OFFICE</text>
</svg>
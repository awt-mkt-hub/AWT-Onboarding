<svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg" width="320" height="90">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2d5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#331E42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: geometric monogram AU styled symbol -->
  <g transform="translate(12, 10)">
    <!-- Outer hexagon shape -->
    <polygon points="34,2 62,18 62,50 34,66 6,50 6,18" fill="none" stroke="#331E42" stroke-width="2.5"/>
    <!-- Inner geometric cross/diamond structure -->
    <line x1="34" y1="2" x2="34" y2="66" stroke="#331E42" stroke-width="1.2" opacity="0.35"/>
    <line x1="6" y1="18" x2="62" y2="50" stroke="#331E42" stroke-width="1.2" opacity="0.35"/>
    <line x1="62" y1="18" x2="6" y2="50" stroke="#331E42" stroke-width="1.2" opacity="0.35"/>
    <!-- Center diamond accent -->
    <polygon points="34,22 46,34 34,46 22,34" fill="#331E42" opacity="0.15"/>
    <polygon points="34,26 42,34 34,42 26,34" fill="none" stroke="#331E42" stroke-width="2" opacity="0.9"/>
    <!-- Center dot -->
    <circle cx="34" cy="34" r="3" fill="#331E42"/>
    <!-- Top accent bar -->
    <line x1="22" y1="11" x2="46" y2="11" stroke="#331E42" stroke-width="2" opacity="0.4"/>
    <!-- Bottom accent bar -->
    <line x1="22" y1="57" x2="46" y2="57" stroke="#331E42" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Vertical divider -->
  <line x1="92" y1="18" x2="92" y2="72" stroke="#331E42" stroke-width="1" opacity="0.25"/>

  <!-- Text group -->
  <g transform="translate(104, 0)">
    <!-- ALOHA - primary name -->
    <text
      x="0"
      y="52"
      font-family="Montserrat, Arial, sans-serif"
      font-size="36"
      font-weight="700"
      letter-spacing="6"
      fill="#331E42"
    >ALOHA</text>

    <!-- UELF - secondary name -->
    <text
      x="2"
      y="70"
      font-family="Montserrat, Arial, sans-serif"
      font-size="13"
      font-weight="400"
      letter-spacing="9"
      fill="#331E42"
      opacity="0.75"
    >UELF</text>

    <!-- Thin underline accent below UELF -->
    <line x1="2" y1="75" x2="175" y2="75" stroke="#331E42" stroke-width="0.8" opacity="0.3"/>
  </g>
</svg>